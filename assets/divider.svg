<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" aria-hidden="true">
<defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .card { fill: #FFFFFF; stroke: #E5E7EB; }
  .ink { fill: #111827; }
  .muted { fill: #4B5563; }
  .faint { stroke: #E5E7EB; }
  .pill { fill: #F3F4F8; }
  .bg-dot { fill: #CBD5E1; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #0D1117; stroke: #262C36; }
    .ink { fill: #F0F6FC; }
    .muted { fill: #9198A1; }
    .faint { stroke: #262C36; }
    .pill { fill: #161B22; }
    .bg-dot { fill: #30363D; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#A855F7"/>
</linearGradient>
<linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
  <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/><stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6"/><stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
</linearGradient>
</defs>

<line x1="0" y1="12" x2="1200" y2="12" stroke="url(#fade)" stroke-width="1.5"/>
<circle cx="200" cy="12" r="3" fill="#A855F7"><animate attributeName="cx" values="200;1000;200" dur="8s" repeatCount="indefinite"/></circle>

</svg>
