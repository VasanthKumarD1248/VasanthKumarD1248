<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-label="2.5+ years building with AI; 12+ production deployments; 10+ business teams served; ~40% faster iteration">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .ink { fill: #0F172A; }
  .muted { fill: #64748B; }
  .accent { fill: #6366F1; }
  .line { stroke: #E2E8F0; }
  .line-strong { stroke: #CBD5E1; }
  .dot { fill: #CBD5E1; }
  .past { fill: #94A3B8; }
