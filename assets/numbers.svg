  @media (prefers-color-scheme: dark) {
    .ink { fill: #E6EDF3; }
    .muted { fill: #8B949E; }
    .accent { fill: #8B93FF; }
    .line { stroke: #30363D; }
    .line-strong { stroke: #484F58; }
    .dot { fill: #484F58; }
    .past { fill: #6E7681; }
    .live { fill: #3FB950; }
  }
</style>
<line x1="0" y1="1" x2="1200" y2="1" class="line" stroke-width="1.5"/>
<line x1="0" y1="103" x2="1200" y2="103" class="line" stroke-width="1.5"/>
<text x="0" y="58" font-size="36" font-weight="600" letter-spacing="-1" class="ink">2.5+</text>
<text x="0" y="82" font-size="14" class="muted">years building with AI</text>
<line x1="300" y1="24" x2="300" y2="80" class="line" stroke-width="1.5"/>
<text x="328" y="58" font-size="36" font-weight="600" letter-spacing="-1" class="ink">12+</text>
<text x="328" y="82" font-size="14" class="muted">production deployments</text>
<line x1="600" y1="24" x2="600" y2="80" class="line" stroke-width="1.5"/>
<text x="628" y="58" font-size="36" font-weight="600" letter-spacing="-1" class="ink">10+</text>
<text x="628" y="82" font-size="14" class="muted">business teams served</text>
<line x1="900" y1="24" x2="900" y2="80" class="line" stroke-width="1.5"/>
<text x="928" y="58" font-size="36" font-weight="600" letter-spacing="-1" class="ink">~40%</text>
