<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="1200" height="48" role="img" aria-label="Featured Work">
<defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .card { fill: #FFFFFF; stroke: #E5E7EB; }
  .ink { fill: #111827; }
  .muted { fill: #4B5563; }
  .faint { stroke: #E5E7EB; }
  .pill { fill: #F3F4F8; }
  .bg-dot { fill: #CBD5E1; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #0D1117; stroke: #262C36; }
    .ink { fill: #F0F6FC; }
    .muted { fill: #9198A1; }
    .faint { stroke: #262C36; }
    .pill { fill: #161B22; }
    .bg-dot { fill: #30363D; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .bar { transform-box: fill-box; transform-origin: left; animation: grow 3s ease-in-out infinite; }
  @keyframes grow { 0%, 100% { transform: scaleX(0.55); } 50% { transform: scaleX(1); } }
</style>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#A855F7"/>
</linearGradient>

</defs>

<text x="0" y="28" font-size="19" font-weight="800" letter-spacing="3" class="ink">FEATURED WORK</text>
<rect class="bar" x="0" y="40" width="80" height="3" rx="1.5" fill="url(#brand)"/>

</svg>
