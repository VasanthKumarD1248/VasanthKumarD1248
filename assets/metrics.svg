<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="Highlights: 2.5+ years in the ai field, 12+ production deployments, 10+ business teams served, ~40% faster iteration">
<defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .card { fill: #FFFFFF; stroke: #E5E7EB; }
  .ink { fill: #111827; }
  .muted { fill: #4B5563; }
  .faint { stroke: #E5E7EB; }
  .pill { fill: #F3F4F8; }
  .bg-dot { fill: #CBD5E1; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #0D1117; stroke: #262C36; }
    .ink { fill: #F0F6FC; }
    .muted { fill: #9198A1; }
    .faint { stroke: #262C36; }
    .pill { fill: #161B22; }
    .bg-dot { fill: #30363D; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#A855F7"/>
</linearGradient>
<linearGradient id="m0" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient><linearGradient id="m1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#D946EF"/></linearGradient><linearGradient id="m2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EC4899"/><stop offset="100%" stop-color="#F97316"/></linearGradient><linearGradient id="m3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
</defs>

<g transform="translate(1,1)">
  <rect width="280" height="106" rx="16" class="card" stroke-width="1.5"/>
  <rect width="280" height="106" rx="16" fill="none" stroke="url(#m0)" stroke-width="1.5" opacity="0.2">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" begin="0.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="24" y="0" width="44" height="3" rx="1.5" fill="url(#m0)"/>
  <text x="24" y="58" font-size="40" font-weight="800" letter-spacing="-1" fill="url(#m0)">2.5+</text>
  <text x="24" y="84" font-size="14" font-weight="500" class="muted">Years in the AI field</text>
</g>
<g transform="translate(307,1)">
  <rect width="280" height="106" rx="16" class="card" stroke-width="1.5"/>
  <rect width="280" height="106" rx="16" fill="none" stroke="url(#m1)" stroke-width="1.5" opacity="0.2">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="24" y="0" width="44" height="3" rx="1.5" fill="url(#m1)"/>
  <text x="24" y="58" font-size="40" font-weight="800" letter-spacing="-1" fill="url(#m1)">12+</text>
  <text x="24" y="84" font-size="14" font-weight="500" class="muted">Production deployments</text>
</g>
<g transform="translate(613,1)">
  <rect width="280" height="106" rx="16" class="card" stroke-width="1.5"/>
  <rect width="280" height="106" rx="16" fill="none" stroke="url(#m2)" stroke-width="1.5" opacity="0.2">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="24" y="0" width="44" height="3" rx="1.5" fill="url(#m2)"/>
  <text x="24" y="58" font-size="40" font-weight="800" letter-spacing="-1" fill="url(#m2)">10+</text>
  <text x="24" y="84" font-size="14" font-weight="500" class="muted">Business teams served</text>
</g>
<g transform="translate(919,1)">
  <rect width="280" height="106" rx="16" class="card" stroke-width="1.5"/>
  <rect width="280" height="106" rx="16" fill="none" stroke="url(#m3)" stroke-width="1.5" opacity="0.2">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" begin="1.7999999999999998s" repeatCount="indefinite"/>
  </rect>
  <rect x="24" y="0" width="44" height="3" rx="1.5" fill="url(#m3)"/>
  <text x="24" y="58" font-size="40" font-weight="800" letter-spacing="-1" fill="url(#m3)">~40%</text>
  <text x="24" y="84" font-size="14" font-weight="500" class="muted">Faster iteration</text>
</g>
</svg>
